name: release


on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '5 0 * * 0'


jobs:
  build:
    uses: madmachineio/actions/.github/workflows/build.yml@main
    with: 
      runners: '["ubuntu-24.04", "macos-15", "macos-15-intel"]'